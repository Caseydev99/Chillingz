<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- detail.js replaces the title and description with the event's own -->
  <title>Event — Chillingz</title>
  <meta name="description" content="Event details, dates, prices and tickets on Chillingz.">
  <meta name="theme-color" content="#2d0d47">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Chillingz">
  <meta property="og:title" content="Event — Chillingz">
  <meta property="og:image" content="images/og-image.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">

  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/site.js"></script>
  <script type="module" src="js/detail.js"></script>
</head>
<body>
  <div data-site-header></div>

  <!-- detail.js fills this in. "data-kind" says whether this is a venue
       (book a table) or an event (request tickets). -->
  <main id="main" class="container detail-page" data-detail data-kind="event">
    <p class="detail-loading">Loading…</p>
  </main>

  <div data-site-footer></div>
</body>
</html>
