# Builds and publishes the Chillingz website to GitHub Pages.
#
# What ends up online (your custom domain, e.g. https://chillingzworldwide.com/,
# or https://<your-user>.github.io/<repo>/ without one):
#   /           the website (website/ folder) with fresh content from Firebase
#   /app/       the Flutter web version of the app
#   /privacy-policy.html etc.   the app's legal pages (Chillingz-main/public)
#
# When it runs:
#   - every push to main
#   - every 3 hours, so new listings added in Firebase show up on the site
#   - whenever you press "Run workflow" on the Actions tab

name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Asks GitHub for the site's address (the custom domain set under
      # Settings → Pages, or the github.io one), so nothing here needs editing
      # when the domain changes.
      - id: pages
        uses: actions/configure-pages@v5

      # --- 1. Website content: copy the app's listings and photos from Firebase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install pillow

      # SITE_URL is the address the site will have, for sitemap.xml and robots.txt
      - run: python website/scripts/export_content.py
        env:
          SITE_URL: https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}/

      # --- 2. Flutter app: only rebuilt when the app's code has changed.
      # The scheduled content refreshes reuse the last build, which keeps
      # them quick (and uses fewer GitHub Actions minutes).
      - id: flutter-cache
        uses: actions/cache@v4
        with:
          path: Chillingz-main/build/web
          key: flutter-web-${{ steps.pages.outputs.base_path }}-${{ hashFiles('Chillingz-main/lib/**', 'Chillingz-main/web/**', 'Chillingz-main/assets/**', 'Chillingz-main/pubspec.lock') }}

      - if: steps.flutter-cache.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # The app lives under /app/ (after /<repo>/ on github.io), so its base
      # href must say so.
      - if: steps.flutter-cache.outputs.cache-hit != 'true'
        working-directory: Chillingz-main
        run: |
          flutter pub get
          flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/app/"

      # --- 3. Put everything together in one folder
      - run: |
          mkdir -p _site
          cp -r website/. _site/
          rm -rf _site/scripts _site/.gitignore _site/README.md
          cp -r Chillingz-main/public/. _site/
          mkdir -p _site/app
          cp -r Chillingz-main/build/web/. _site/app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
